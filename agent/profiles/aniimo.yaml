# 애니모 Aniimo — 기록 모드 프로필 (Fair Play 정책: 자동 입력 금지 → 입력 0건)
# 영역 값은 자리표시다. 0단계 시험(tools/시험0.py --coords)으로 실제 화면을 보며 채운다.
id: aniimo
이름: 애니모
모드: 기록
창제목: "Aniimo"
해상도기준: [1920, 1080]
하루상한분: 240
실행:                  # 켜기만 자동. 런처 버튼 클릭도 하지 않는다(기록 모드 = 입력 0건). 아래는 자리표시
  파일: "<게임 또는 공식 런처 exe 경로>"
  인자: ""
  런처창제목: ""
  런처시작버튼: {}      # 기록 모드는 항상 비워 둔다 — [게임 시작]은 사장님이 누른다
  창대기초: 180
버튼: {}               # 기록 모드는 비워 둔다(입력 0건)
금지화면: []
영역:
  퀘스트표시: {x: 0.00, y: 0.25, w: 0.22, h: 0.25}
  미니맵:     {x: 0.00, y: 0.00, w: 0.16, h: 0.22}
