<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>maim — 네이버 블로그 콘텐츠 생성</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>maim 대시보드</h1>
    <p class="muted">AI가 글과 이미지를 준비해두면, 여기서 복사해서 네이버 블로그에 직접 붙여넣으세요.</p>
  </header>

  <main>
    <section>
      <h2>카테고리</h2>
      <table id="category-table">
        <thead>
          <tr><th>이름</th><th>검색필요</th><th>활성</th><th>동작</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <details>
        <summary>새 카테고리 추가</summary>
        <form id="category-form">
          <input name="name" placeholder="카테고리 이름" required />
          <label><input type="checkbox" name="requiresSearch" /> 실시간 검색 필요</label>
          <input name="promptHint" placeholder="카테고리 설명(프롬프트 힌트)" required />
          <button type="submit">추가</button>
        </form>
      </details>
    </section>

    <section>
      <h2>준비된 초안 <span id="cap-indicator" class="badge"></span></h2>
      <div id="ready-list"></div>
    </section>

    <section>
      <h2>히스토리</h2>
      <table id="history-table">
        <thead>
          <tr><th>ID</th><th>카테고리</th><th>제목</th><th>상태</th><th>발행완료 표시 시각</th><th>에러</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>설정</h2>
      <form id="settings-form">
        <label>하루 최대 생성 개수 (최대 5) <input name="postsPerDay" type="number" min="1" max="5" /></label>
        <button type="submit">저장</button>
      </form>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
