<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>maim — 네이버 블로그 콘텐츠 생성</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>maim 대시보드</h1>
    <p class="muted">AI가 글과 이미지를 준비해두면, 여기서 복사해서 네이버 블로그에 직접 붙여넣으세요.</p>
  </header>

  <main>
    <section>
      <h2>카테고리</h2>
      <table id="category-table">
        <thead>
          <tr><th>이름</th><th>활성</th><th>주제 키워드</th><th>동작</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <div class="subsection">
        <h3>새 카테고리 추가</h3>
        <form id="category-form">
          <input name="name" placeholder="카테고리 이름" required />
          <input name="promptHint" placeholder="카테고리 설명(프롬프트 힌트)" required />
          <input name="topicKeyword" placeholder="주제 키워드(선택, 예: 2026 최저임금)" />
          <button type="submit" class="btn-primary">추가</button>
        </form>
      </div>
    </section>

    <section>
      <h2>준비된 초안</h2>
      <div id="ready-list"></div>
    </section>

    <section>
      <h2>히스토리</h2>
      <table id="history-table">
        <thead>
          <tr><th>ID</th><th>카테고리</th><th>제목</th><th>상태</th><th>발행완료 표시 시각</th><th>에러</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
